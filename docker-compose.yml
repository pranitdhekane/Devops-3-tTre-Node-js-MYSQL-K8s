services:

  db:

    image: mysql:8.0

    environment:

      MYSQL_ROOT_PASSWORD: pranit

      MYSQL_DATABASE: test_db

    ports:

    - "3306:3306"

    restart: unless-stopped

    command: --default-authentication-plugin=mysql_native_password

    volumes:

      - ./server/database/db.sql:/docker-entrypoint-initdb.d/db.sql

    healthcheck:

      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppranit"]

      interval: 10s

      timeout: 5s

      retries: 5

      start_period: 30s


  backend:

    image: dpranit/server:latest

    environment:

      host: db

      user: root

      password: pranit

      database: test_db

    ports:

      - "5001:5000"

    depends_on:

      db:

        condition: service_healthy

  weui:

    image: dpranit/user-mgmt:latest

    container_name: web-ui

    ports:

      - "81:80"

    depends_on:

      - backend

