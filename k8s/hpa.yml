kind: HorizontalPodAutoscaler
apiVersion: autoscaling/v2

metadata:
  name: user-mgmt-hpa
  namespace: user-mgmt
  
spec:
  scaleTargetRef:
      kind: Deployment
      apiVersion: apps/v1
      name: user-mgmt-app-dep

  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target: 
        type: Utilization
        averageUtilization: 30


    
